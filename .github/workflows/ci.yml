name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: typecheck / test / lint:css
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: pnpm lint:css
